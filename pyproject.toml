
[tool.isort]
line_length = 79
multi_line_output = 0
extra_standard_library = ["setuptools"]
known_first_party = ["mmtrack"]
known_third_party = [
    "PIL",
    "addict",
    "cv2",
    "lap",
    "matplotlib",
    "mmcls",
    "mmcv",
    "mmdet",
    "motmetrics",
    "numpy",
    "packaging",
    "pandas",
    "pycocotools",
    "pytest",
    "pytorch_sphinx_theme",
    "requests",
    "scipy",
    "script_utils",
    "seaborn",
    "tao",
    "terminaltables",
    "torch",
    "tqdm"
]
no_lines_before = ["STDLIB", "LOCALFOLDER"]
default_section = "THIRDPARTY"  # codespell:ignore

[tool.yapf]
based_on_style = "pep8"
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[tool.codespell]
skip = "*.ipynb,configs/v3det/category_name_13204_v3det_2023_v1.txt,**/labels_names.json,tools/dataset_converters/zhiyuan_objv2_train_names_fix.csv"
quiet-level = 3
ignore-words-list = "patten,nd,ty,mot,hist,formating,winn,gool,datas,wan,confids,TOOD,tood,ba,warmup,nam,DOTA,dota,conveyer,PRES,insId,burnin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--xdoctest --xdoctest-style=auto"
norecursedirs = ".git ignore build __pycache__ data docker docs .eggs"
filterwarnings = [
    "default",
    "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning",
    "ignore:.*Define the __nice__ method for.*:Warning"
]
